set_zeal_room_temperature:
  name: Set ZEAL room temperature
  description: >-
    Explicit Block 2 test action. Resolves a discovered ZEAL room thermostat and
    calls climate.set_temperature only for that ZEAL thermostat entity.
  fields:
    entity_id:
      name: ZEAL room thermostat
      description: A discovered ZEAL room thermostat; underlying TRVs are rejected.
      required: true
      selector:
        entity:
          domain: climate
    temperature:
      name: Target temperature
      description: Requested temperature in the integration's Home Assistant reference unit.
      required: true
      selector:
        number:
          step: 0.1
